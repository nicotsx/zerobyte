name: Branch Image

on:
  workflow_dispatch:

permissions:
  contents: read

run-name: Branch image for ${{ github.ref_name }}

jobs:
  determine-image-tag:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Set image tag
        id: tag
        run: echo "image_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  checks:
    uses: ./.github/workflows/checks.yml

  e2e-tests:
    uses: ./.github/workflows/e2e.yml

  integration-tests:
    uses: ./.github/workflows/integration.yml

  build-agent-image:
    needs: [determine-image-tag, checks, e2e-tests, integration-tests]
    uses: ./.github/workflows/agent-image.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.determine-image-tag.outputs.image_tag }}
      channel: ${{ needs.determine-image-tag.outputs.image_tag }}

  build-image:
    environment: release
    timeout-minutes: 60
    needs: [determine-image-tag, checks, e2e-tests, integration-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/zerobyte
          tags: |
            type=raw,value=${{ needs.determine-image-tag.outputs.image_tag }}
          flavor: |
            latest=false

      - name: Push image to GitHub Container Registry
        uses: ./.github/actions/build-image
        with:
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          version: ${{ needs.determine-image-tag.outputs.image_tag }}

      - name: Write image summary
        run: |
          echo "Published image:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`ghcr.io/${{ github.repository_owner }}/zerobyte:${{ needs.determine-image-tag.outputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
