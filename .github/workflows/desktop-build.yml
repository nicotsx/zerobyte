name: Desktop Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      sign_windows:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  macos:
    environment: release
    timeout-minutes: 30
    runs-on: macos-15
    permissions:
      contents: read
    env:
      ZEROBYTE_DESKTOP_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install dependencies
        uses: "./.github/actions/install-dependencies"

      - name: Write Apple notarization key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          api_key_path="$RUNNER_TEMP/apple-api-key.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$api_key_path"
          echo "APPLE_API_KEY=$api_key_path" >> "$GITHUB_ENV"

      - name: Build signed and notarized DMG
        working-directory: apps/desktop
        env:
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          ZEROBYTE_REQUIRE_MAC_SIGNING: "true"
        run: bun run make

      - name: Verify macOS signing and notarization
        working-directory: apps/desktop
        run: |
          app_path="$(find dist -maxdepth 2 -type d -name '*.app' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"

      - name: Remove Apple notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/apple-api-key.p8"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-macos-release
          path: apps/desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  windows:
    timeout-minutes: 30
    runs-on: windows-2025
    permissions:
      actions: read
      contents: read
    env:
      ZEROBYTE_DESKTOP_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install dependencies
        uses: "./.github/actions/install-dependencies"

      - name: Build Windows installer
        working-directory: apps/desktop
        run: bun run make:windows

      - name: Upload unsigned Windows installer
        if: ${{ inputs.sign_windows }}
        id: upload-unsigned-windows
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-windows-unsigned
          path: apps/desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Sign Windows installer
        if: ${{ inputs.sign_windows }}
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-windows.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed-windows

      - name: Verify Windows signature
        if: ${{ inputs.sign_windows }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem "signed-windows" -Recurse -Filter "*.exe" | Select-Object -First 1
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "Valid") {
            throw "Windows installer signature is $($signature.Status): $($signature.StatusMessage)"
          }

      - name: Upload signed Windows installer
        if: ${{ inputs.sign_windows }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-windows-release
          path: signed-windows/**/*.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload unsigned Windows release installer
        if: ${{ ! inputs.sign_windows }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-windows-release
          path: apps/desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  linux:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ZEROBYTE_DESKTOP_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install dependencies
        uses: "./.github/actions/install-dependencies"

      - name: Build Linux AppImage
        working-directory: apps/desktop
        run: bun run make:linux

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-linux-release
          path: apps/desktop/dist/*.AppImage
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
