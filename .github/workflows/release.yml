name: Release Workflow

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-beta.*"
      - "v*.*.*-alpha.*"

permissions:
  contents: read

jobs:
  determine-release-type:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      release_type: ${{ steps.set-type.outputs.release_type }}
      tagname: ${{ github.ref_name }}
      is_minor_release: ${{ steps.set-type.outputs.is_minor_release }}
    steps:
      - name: Set release type
        id: set-type
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [[ $TAG == *-alpha* ]]; then
            echo "release_type=alpha" >> $GITHUB_OUTPUT
          elif [[ $TAG == *-beta* ]]; then
            echo "release_type=beta" >> $GITHUB_OUTPUT
          else
            echo "release_type=release" >> $GITHUB_OUTPUT
          fi

          if [[ $TAG =~ ^v[0-9]+\.[0-9]+\.0$ ]]; then
            echo "is_minor_release=true" >> $GITHUB_OUTPUT
          else
            echo "is_minor_release=false" >> $GITHUB_OUTPUT
          fi

  checks:
    uses: ./.github/workflows/checks.yml

  e2e-tests:
    uses: ./.github/workflows/e2e.yml

  integration-tests:
    uses: ./.github/workflows/integration.yml

  build-images:
    environment: release
    timeout-minutes: 60
    needs: [determine-release-type, package-agent-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/zerobyte
          tags: |
            type=semver,pattern={{version}},prefix=v
            type=semver,pattern={{major}},prefix=v,enable=${{ needs.determine-release-type.outputs.release_type == 'release' }}
            type=semver,pattern={{major}}.{{minor}},prefix=v,enable=${{ needs.determine-release-type.outputs.release_type == 'release' }}
            type=semver,pattern={{major}}.{{minor}}.{{patch}},prefix=v,enable=${{ needs.determine-release-type.outputs.release_type == 'release' }}
          flavor: |
            latest=${{ needs.determine-release-type.outputs.release_type == 'release' }}

      - name: Push images to GitHub Container Registry
        uses: ./.github/actions/build-image
        with:
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          version: ${{ needs.determine-release-type.outputs.tagname }}

  build-agent-binaries:
    needs: [checks, e2e-tests, integration-tests]
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - arch: x64
            target: bun-linux-x64-baseline
            runner: ubuntu-24.04
          - arch: arm64
            target: bun-linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: "./.github/actions/install-dependencies"

      - name: Build executable
        env:
          ZEROBYTE_AGENT_VERSION: ${{ github.ref_name }}
        run: >-
          bun run build:agent --target=${{ matrix.target }}
          --outfile=.output/agent-binaries/zerobyte-agent-linux-${{ matrix.arch }}

      - name: Test agent and compiled CLI
        env:
          AGENT_BINARY: ${{ github.workspace }}/.output/agent-binaries/zerobyte-agent-linux-${{ matrix.arch }}
          ZEROBYTE_AGENT_VERSION: ${{ github.ref_name }}
        run: bun run --cwd apps/agent test

      - name: Prepare release assets
        working-directory: .output/agent-binaries
        run: |
          sha256sum zerobyte-agent-linux-${{ matrix.arch }} > zerobyte-agent-linux-${{ matrix.arch }}.sha256
          cp ../../LICENSE zerobyte-agent-linux-${{ matrix.arch }}.LICENSE.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zerobyte-agent-linux-${{ matrix.arch }}
          path: .output/agent-binaries/*
          if-no-files-found: error
          overwrite: true

  build-agent-images:
    needs: [determine-release-type, package-agent-release]
    uses: ./.github/workflows/agent-image.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.determine-release-type.outputs.tagname }}
      stable: ${{ needs.determine-release-type.outputs.release_type == 'release' }}

  package-agent-release:
    needs: build-agent-binaries
    uses: ./.github/workflows/attest-agent-release.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-images, build-agent-images, package-agent-release, determine-release-type]
    concurrency:
      group: publish-release-${{ github.ref }}
    permissions:
      contents: write
    outputs:
      id: ${{ steps.create_release.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: agent-release-assets
          path: agent-dist

      - name: Stage and publish GitHub release
        id: create_release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PRERELEASE: ${{ needs.determine-release-type.outputs.release_type != 'release' }}
        with:
          script: |
            const { publishAgentRelease } = require('./scripts/publish-agent-release.mjs');
            const id = await publishAgentRelease({
              github,
              repo: context.repo,
              tag: process.env.GITHUB_REF_NAME,
              prerelease: process.env.PRERELEASE === 'true',
              directory: 'agent-dist',
            });
            core.setOutput('id', id);

  build-desktop:
    needs: [determine-release-type, checks, e2e-tests, integration-tests]
    if: needs.determine-release-type.outputs.release_type == 'release' || needs.determine-release-type.outputs.release_type == 'beta'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/desktop-build.yml
    with:
      version: ${{ github.ref_name }}
      sign_windows: false
    secrets: inherit

  publish-desktop-assets:
    needs: [build-desktop, publish-release]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download DMG
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: desktop-macos-release
          path: release-assets

      - name: Download Windows installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: desktop-windows-release
          path: release-assets

      - name: Download Linux AppImage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: desktop-linux-release
          path: release-assets

      - name: Attest desktop release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release-assets/*.dmg
            release-assets/*.exe
            release-assets/*.AppImage

      - name: Upload desktop release assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          make_latest: "false"
          files: |
            release-assets/*.dmg
            release-assets/*.exe
            release-assets/*.AppImage
          fail_on_unmatched_files: true

  request-docs-version-update:
    uses: ./.github/workflows/request-docs-version-update.yml
    needs: [publish-release, determine-release-type]
    if: needs.determine-release-type.outputs.release_type == 'release' && needs.determine-release-type.outputs.is_minor_release == 'true'
    with:
      release_tag: ${{ needs.determine-release-type.outputs.tagname }}
      base_branch: ${{ github.event.repository.default_branch }}
    secrets:
      COPILOT_ASSIGNMENT_TOKEN: ${{ secrets.COPILOT_ASSIGNMENT_TOKEN }}

  deploy-api-docs:
    needs: publish-release
    uses: ./.github/workflows/api-docs-deploy.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
