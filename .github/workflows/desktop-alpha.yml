name: Desktop Alpha

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Alpha version without the leading v (for example: 1.0.0-alpha.1)"
        required: true
        type: string
      create_release:
        description: "Create a public GitHub prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Validate version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            echo "Version must look like 1.0.0-alpha.1" >&2
            exit 1
          fi

          app_version="v$VERSION"
          release_tag="desktop-v$VERSION"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  build-macos:
    needs: [validate, checks]
    environment: release
    timeout-minutes: 30
    runs-on: macos-15
    permissions:
      contents: read
    env:
      ZEROBYTE_DESKTOP_VERSION: ${{ needs.validate.outputs.app_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install dependencies
        uses: "./.github/actions/install-dependencies"

      - name: Write Apple notarization key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          api_key_path="$RUNNER_TEMP/apple-api-key.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$api_key_path"
          echo "APPLE_API_KEY=$api_key_path" >> "$GITHUB_ENV"

      - name: Build signed and notarized DMG
        working-directory: apps/desktop
        env:
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          ZEROBYTE_REQUIRE_MAC_SIGNING: "true"
        run: bun run make

      - name: Verify macOS signing and notarization
        working-directory: apps/desktop
        run: |
          app_path="$(find dist -maxdepth 2 -type d -name '*.app' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"

      - name: Remove Apple notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/apple-api-key.p8"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-macos-release
          path: apps/desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build-windows:
    needs: [validate, checks]
    timeout-minutes: 30
    runs-on: windows-2025
    permissions:
      actions: read
      contents: read
    env:
      ZEROBYTE_DESKTOP_VERSION: ${{ needs.validate.outputs.app_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install dependencies
        uses: "./.github/actions/install-dependencies"

      - name: Build Windows installer
        working-directory: apps/desktop
        run: bun run make:windows

      - name: Upload unsigned Windows installer
        id: upload-unsigned-windows
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-windows-unsigned
          path: apps/desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Sign Windows installer
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-windows.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed-windows

      - name: Verify Windows signature
        shell: pwsh
        run: |
          $installer = Get-ChildItem "signed-windows" -Recurse -Filter "*.exe" | Select-Object -First 1
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "Valid") {
            throw "Windows installer signature is $($signature.Status): $($signature.StatusMessage)"
          }

      - name: Upload signed Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-windows-release
          path: signed-windows/**/*.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build-linux:
    needs: [validate, checks]
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ZEROBYTE_DESKTOP_VERSION: ${{ needs.validate.outputs.app_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install dependencies
        uses: "./.github/actions/install-dependencies"

      - name: Build Linux AppImage
        working-directory: apps/desktop
        run: bun run make:linux

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-linux-release
          path: apps/desktop/dist/*.AppImage
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    if: ${{ inputs.create_release }}
    needs: [validate, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download DMG
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-macos-release
          path: release-assets

      - name: Download Windows installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-windows-release
          path: release-assets

      - name: Download Linux AppImage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-linux-release
          path: release-assets

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release-assets/*.dmg
            release-assets/*.exe
            release-assets/*.AppImage

      - name: Publish desktop alpha prerelease
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.validate.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Zerobyte desktop ${{ needs.validate.outputs.app_version }}
          body: |
            > [!WARNING]
            > This is an early Zerobyte Desktop alpha, not an official stable release.

            macOS Apple Silicon, Windows x64, and Linux x64. Expect rough edges and verify important restores independently.

            The macOS app is signed with an Apple Developer ID and notarized by Apple. The Windows installer is Authenticode-signed. All three downloads have signed GitHub build-provenance attestations.

            On Linux, make the AppImage executable before launching it: `chmod +x zerobyte*.AppImage`.
          files: |
            release-assets/*.dmg
            release-assets/*.exe
            release-assets/*.AppImage
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
          make_latest: false
