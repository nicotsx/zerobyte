name: Desktop Alpha

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Alpha version without the leading v (for example: 1.0.0-alpha.1)"
        required: true
        type: string
      create_release:
        description: "Create a public GitHub prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Validate version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            echo "Version must look like 1.0.0-alpha.1" >&2
            exit 1
          fi

          app_version="v$VERSION"
          release_tag="desktop-v$VERSION"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  build-desktop:
    needs: [validate, checks]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/desktop-build.yml
    with:
      version: ${{ needs.validate.outputs.app_version }}
      sign_windows: false
    secrets: inherit

  publish:
    if: ${{ inputs.create_release }}
    needs: [validate, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download DMG
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-macos-release
          path: release-assets

      - name: Download Windows installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-windows-release
          path: release-assets

      - name: Download Linux AppImage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-linux-release
          path: release-assets

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release-assets/*.dmg
            release-assets/*.exe
            release-assets/*.AppImage

      - name: Publish desktop alpha prerelease
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.validate.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Zerobyte desktop ${{ needs.validate.outputs.app_version }}
          body: |
            > [!WARNING]
            > This is an early Zerobyte Desktop alpha, not an official stable release.

            macOS Apple Silicon, Windows x64, and Linux x64. Expect rough edges and verify important restores independently.

            The macOS app is signed with an Apple Developer ID and notarized by Apple. The Windows installer is unsigned while code signing is being set up. All three downloads have signed GitHub build-provenance attestations.

            On Linux, make the AppImage executable before launching it: `chmod +x zerobyte*.AppImage`.
          files: |
            release-assets/*.dmg
            release-assets/*.exe
            release-assets/*.AppImage
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
          make_latest: false
